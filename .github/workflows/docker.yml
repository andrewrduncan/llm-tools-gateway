name: build image

# Publishes ghcr.io/<owner>/llm-tools-gateway so deployments can pull a built
# image instead of compiling locally. Tags:
#   :latest          -> newest commit on main (what an auto-updater follows)
#   :sha-<7 chars>   -> immutable, for pinning or rollback
#   :vX.Y.Z / :vX.Y  -> on git tags, for pinning to a major/minor line
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19, and a build
    # that publishes the deployed image should not change host OS unannounced.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Pull requests build but must not publish.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Playwright base image is large; cache layers between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
